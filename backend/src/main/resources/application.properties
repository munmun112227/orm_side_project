# =============================================================================
# POS 雙 ORM 報表系統 Spring Boot 配置
# =============================================================================
spring.application.name=pos-analytics-backend
server.port=9080

# 資料庫連線配置 (支援 EC2 宿主機共用 PostgreSQL 與獨立 DB Name 區隔)
spring.datasource.url=jdbc:postgresql://${DB_HOST:host.docker.internal}:${DB_PORT:5432}/${DB_NAME:pos}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:pospassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP 連線池調優
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Spring Data JPA 配置
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# MyBatis 配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.pos.analytics.dto
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.cache-enabled=false

# JSON 回應格式
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Taipei
