# =============================================================================
# 單元與整合測試設定 (PostgreSQL 測試環境 + 脫敏假資料)
# 支援本地 PostgreSQL 與 GitHub Actions 官方 PostgreSQL 16 Service Container
# 零真實客戶個資 (Zero PII)
# =============================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pos}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:pospassword}

# 測試時由 Hibernate 自動建立與銷毀 transactions 表
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 延遲資料初始化至 JPA 建表完成後載入脫敏合成資料 (Zero PII)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:data-test.sql
spring.sql.init.mode=always

# MyBatis 配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
