# =============================================================================
# 單元與整合測試設定 (H2 記憶體資料庫 + 脫敏假資料)
# 完全不依賴外部任何真實資料庫，確保 GitHub CI 與本地測試 100% 穩定
# =============================================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 由 Hibernate 自動建立/銷毀記憶體資料庫結構 (create-drop)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# 延遲資料初始化至 JPA 建表完成後 (Spring Boot 官方標準設定)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:data-test.sql
spring.sql.init.mode=always

# MyBatis 配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
