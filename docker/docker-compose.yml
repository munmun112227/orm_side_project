version: '3.8'

services:
  # =========================================================================
  # 1. 前端 Vue 3 + Nginx (對外預設開放 Port 3000，避開 80 與 8080 衝突)
  # =========================================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: pos-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:3000}:80"
    depends_on:
      - backend

  # =========================================================================
  # 2. 後端 Spring Boot (內部監聽 8080，不對宿主機暴露，防止 8080 衝突)
  # =========================================================================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: pos-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 連線 EC2 宿主機共用之 PostgreSQL (Port 5432)，以 DB Name 區隔
      DB_HOST: "${DB_HOST:host.docker.internal}"
      DB_PORT: "${DB_PORT:5432}"
      DB_NAME: "${DB_NAME:pos}"
      DB_USER: "${DB_USER:postgres}"
      DB_PASSWORD: "${DB_PASSWORD:pospassword}"
    expose:
      - "9080"

  # =========================================================================
  # 3. 可選獨立 PostgreSQL (若 EC2 已有既有 PostgreSQL 則無需啟動此服務)
  #    啟動方式: docker compose --profile standalone up -d
  # =========================================================================
  postgres-standalone:
    profiles: ["standalone"]
    image: postgres:16-alpine
    container_name: pos-postgres-standalone
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_NAME:pos}"
      POSTGRES_USER: "${DB_USER:postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:pospassword}"
    ports:
      - "5433:5432" # 避開 5432 衝突，映射至 5433
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../ddl_transactions.sql:/docker-entrypoint-initdb.d/01_ddl.sql
      - ../dml_sample_insert.sql:/docker-entrypoint-initdb.d/02_sample.sql

volumes:
  pgdata:
